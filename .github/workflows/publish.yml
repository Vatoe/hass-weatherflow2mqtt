name: publish

# Builds the add-on image for all three Home Assistant architectures and pushes it to
# ghcr.io/vatoe/hass-weatherflow2mqtt, tagged with the "version" in config.json (plus "latest").
# A version that is already published is never rebuilt - bump config.json to release.

on:
  push:
    branches:
      - main
    paths:
      - config.json
      - Dockerfile
      - requirements.txt
      - setup.py
      - weatherflow2mqtt/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-weatherflow2mqtt-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/vatoe/hass-weatherflow2mqtt

    steps:
    - uses: actions/checkout@v4

    - name: Read version from config.json
      id: ver
      run: echo "version=$(jq -r .version config.json)" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Is this version already published?
      id: exists
      run: |
        if docker buildx imagetools inspect "$IMAGE:${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "::notice::$IMAGE:${{ steps.ver.outputs.version }} already exists - skipping build"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.exists.outputs.published == 'false'
      uses: docker/setup-qemu-action@v3

    - if: steps.exists.outputs.published == 'false'
      uses: docker/setup-buildx-action@v3

    - name: Build and push (amd64, aarch64, armv7)
      if: steps.exists.outputs.published == 'false'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          ${{ env.IMAGE }}:latest
